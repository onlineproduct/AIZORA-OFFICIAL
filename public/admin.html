<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIZORA OFFICIAL Admin</title><link rel="stylesheet" href="/style.css"></head><body><header><strong>✦ AIZORA OFFICIAL · Admin</strong><nav><a href="/">স্টোরে ফিরুন</a></nav></header><main><section class="hero"><h1>Admin Dashboard</h1><p>Admin token দিয়ে প্রবেশ করুন। Token শুধু আপনার নিজের নিরাপদ পরিবেশে ব্যবহার করুন।</p></section><section><h2>নিরাপদ অ্যাডমিন প্রবেশ</h2><form id="loginForm"><input id="token" type="password" autocomplete="current-password" required placeholder="ADMIN_TOKEN"><button class="button">সংযোগ</button><button class="button secondary" type="button" id="logout">লগআউট</button></form><p id="status" role="status"></p></section><section><h2>পণ্য যোগ করুন</h2><form id="productForm" class="form-grid"><select name="type"><option value="physical">Physical</option><option value="digital">Digital</option></select><input name="name" required placeholder="পণ্যের নাম"><input name="price" type="number" min="0" required placeholder="মূল্য (৳)"><input name="stock" type="number" min="0" placeholder="স্টক (physical)"><input name="icon" maxlength="12" placeholder="আইকন (ঐচ্ছিক)"><textarea name="description" placeholder="বর্ণনা"></textarea><button class="button">পণ্য সংরক্ষণ</button></form></section><section><h2>বিক্রয় রিপোর্ট</h2><button class="button" id="reportRefresh" type="button">রিপোর্ট দেখুন</button><div id="report"></div></section><section><h2>অর্ডার ও পেমেন্ট</h2><button class="button" id="refresh">রিফ্রেশ</button><div id="orders"></div></section><section><h2>পণ্যের তালিকা</h2><div id="products"></div></section></main><script src="/admin.js" defer></script></body></html>
